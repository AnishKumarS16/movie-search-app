<!DOCTYPE html>
<!--
    This declaration tells the browser that this document uses HTML5.
-->

<html lang="en">

<head>

    <meta charset="UTF-8">

    <!--
        UTF-8 ensures proper rendering of text, symbols, and emojis.
    -->

    <title>Movie Search App</title>

    <style>

        /*
            GLOBAL BODY STYLING
            -------------------
            Sets default font, removes browser margin/padding,
            and applies a cinematic background.
        */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #ffffff;

            background:
                linear-gradient(rgba(0, 0, 0, 0.75),
                                rgba(0, 0, 0, 0.75)),
                url("https://images.unsplash.com/photo-1524985069026-dd778a71c7b4");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        /*
            HEADER STYLING
            --------------
            Displays the application title.
        */

        header {
            background: rgba(229, 9, 20, 0.9);
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }


        /*
            SEARCH BOX CONTAINER
            --------------------
            Uses flexbox to center input and button.
        */

        .search-box {
            display: flex;
            justify-content: center;
            margin: 30px;
        }


        /*
            INPUT FIELD STYLING
            -------------------
        */

        input {
            width: 300px;
            padding: 10px;
            font-size: 16px;

            border-radius: 5px 0 0 5px;
            border: none;
            outline: none;
        }


        /*
            SEARCH BUTTON STYLING
            ---------------------
        */

        button {
            padding: 10px 20px;
            font-size: 16px;

            border: none;
            cursor: pointer;

            background: #e50914;
            color: white;

            border-radius: 0 5px 5px 0;
        }


        button:hover {
            background: #b20710;
        }


        /*
            MOVIE CARD
            ----------
            Displays movie poster and information.
        */

        .movie-card {
            max-width: 700px;

            margin: 20px auto;

            background: rgba(31, 31, 31, 0.9);

            padding: 20px;

            border-radius: 10px;

            display: flex;

            gap: 20px;

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }


        /*
            POSTER IMAGE
        */

        .movie-card img {
            width: 200px;
            height: auto;

            border-radius: 10px;
        }


        /*
            MOVIE INFORMATION
        */

        .movie-info h2 {
            margin-top: 0;
        }


        /*
            ERROR MESSAGE
        */

        .error {
            text-align: center;

            color: #ff4c4c;

            font-size: 18px;
        }


        /*
            LOGOUT BUTTON
            -------------
            Separate styling so it doesn't look
            like the search button.
        */

        .logout-container {
            text-align: center;
            margin-top: 20px;
        }


        .logout-button {
            padding: 10px 25px;

            background: #555;

            color: white;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }


        .logout-button:hover {
            background: #333;
        }

    </style>

</head>


<body>


    <!--
        APPLICATION HEADER
    -->

    <header>
        🎬 Movie Search App
    </header>


    <!--
        SEARCH INPUT AND BUTTON
    -->

    <div class="search-box">

        <input
            type="text"
            id="movieInput"
            placeholder="Enter movie name..."
        >

        <button onclick="searchMovie()">
            Search
        </button>

    </div>


    <!--
        RESULT CONTAINER

        Movie information or error messages
        will be displayed here.
    -->

    <div id="result"></div>


    <!--
        LOGOUT BUTTON
    -->

    <div class="logout-container">

        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <script>


        /*
            OMDb API KEY

            This key is used to access movie information
            from the OMDb API.
        */

        const API_KEY = "1c04796f";


        /*
            SEARCH MOVIE FUNCTION
            ---------------------
            Gets the movie name from the input field,
            sends a request to OMDb API,
            and displays the movie information.
        */

        async function searchMovie() {


            /*
                Get movie name entered by the user.
            */

            const movieName =
                document.getElementById("movieInput").value;


            /*
                Get the result container.
            */

            const resultDiv =
                document.getElementById("result");


            /*
                VALIDATION

                Check whether the input is empty.
            */

            if (movieName.trim() === "") {

                resultDiv.innerHTML =
                    "<p class='error'>Please enter a movie name</p>";

                return;
            }


            /*
                Clear previous result.
            */

            resultDiv.innerHTML = "";


            try {


                /*
                    FETCH MOVIE DATA

                    encodeURIComponent() handles spaces
                    and special characters in movie names.
                */

                const response = await fetch(
                    `https://www.omdbapi.com/?t=${encodeURIComponent(movieName)}&apikey=${API_KEY}`
                );


                /*
                    Convert API response into JavaScript object.
                */

                const data = await response.json();


                /*
                    CHECK IF MOVIE WAS NOT FOUND.
                */

                if (data.Response === "False") {

                    resultDiv.innerHTML =
                        `<p class="error">${data.Error}</p>`;

                    return;
                }


                /*
                    DISPLAY MOVIE INFORMATION
                */

                resultDiv.innerHTML = `

                    <div class="movie-card">

                        <img
                            src="${
                                data.Poster !== "N/A"
                                    ? data.Poster
                                    : "https://via.placeholder.com/200x300"
                            }"
                            alt="Movie Poster"
                        >

                        <div class="movie-info">

                            <h2>
                                ${data.Title} (${data.Year})
                            </h2>

                            <p>
                                <strong>Genre:</strong>
                                ${data.Genre}
                            </p>

                            <p>
                                <strong>IMDB Rating:</strong>
                                ⭐ ${data.imdbRating}
                            </p>

                            <p>
                                <strong>Plot:</strong>
                                ${data.Plot}
                            </p>

                        </div>

                    </div>

                `;


            } catch (error) {


                /*
                    ERROR HANDLING

                    Displays a message if the API request
                    fails or there is a network problem.
                */

                resultDiv.innerHTML =
                    "<p class='error'>Something went wrong</p>";
            }

        }


        /*
            LOGOUT FUNCTION
            ---------------
            Returns the user to the login page.
        */

        function logout() {

            window.location.href = "login.html";

        }


        /*
            OPTIONAL FEATURE

            Allows the user to press ENTER inside
            the search box to search for a movie.
        */

        document
            .getElementById("movieInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    searchMovie();

                }

            });


    </script>


</body>

</html>
